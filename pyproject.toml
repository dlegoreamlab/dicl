[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicl"
version = "2.2.0"
description = "Dlegoream Intelligence Crawling Library — Web Intelligence Discovery Framework"
readme = "README.md"
authors = [{ name = "Dlegoream Laboratory" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "dfss @ git+https://github.com/dlegoreamlab/dfss.git@main",
]

[project.optional-dependencies]
heavy = ["playwright>=1.30"]
telegram = ["telethon>=1.36"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dicl*"]
